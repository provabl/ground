name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # internal/iac's toolchain checks shell out to a real binary and SKIP if none
      # is present, so without these the checks silently pass. The *_wrapper: false
      # options matter: the default wrapper is a shell script exec.LookPath would
      # find but that mangles output. 'fmt -check', 'init -backend=false' and
      # 'validate' are read-only — no credentials, no AWS API calls.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Test
        run: go test ./...

      # The export's parity claim rests on more than the Go tests: the HCL must be
      # fmt-canonical (the file says "do not edit manually", so formatting is the
      # generator's job) and must validate against the real AWS provider, which is
      # what catches a transpiled argument that doesn't exist on its resource.
      #
      # Run both under BOTH toolchains. The Go tests prove terraform and opentofu
      # get a byte-identical main.tf; only running each tool proves both accept it.
      # A skip here is a failure — an unenforced guarantee reads as an enforced one.
      - name: Verify the HCL is fmt-clean and validates under both toolchains
        env:
          GROUND_IAC_VALIDATE: "1"
        run: |
          for tool in terraform tofu; do
            echo "::group::$tool"
            GROUND_IAC_TOOL="$tool" go test ./internal/iac/ -count=1 -v \
              -run 'TestHCL_IsFmtClean|TestHCL_Validates' | tee "/tmp/hcl-$tool.log"
            echo "::endgroup::"
            if grep -q "SKIP" "/tmp/hcl-$tool.log"; then
              echo "::error::the HCL checks skipped under $tool — it is missing from the runner"
              exit 1
            fi
          done

      - name: Vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run ./...
